<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Music Player & Downloader</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="icon.png">
    
    <!-- Stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="dark-mode">

    <!-- Header Navbar -->
    <header class="navbar">
        <div class="nav-container">
            <div class="nav-left">
                <button id="backBtn" class="btn-circle back-btn" title="Go Back">←</button>
                <a href="javascript:void(0)" class="brand-logo" onclick="loadHomePage()" title="Home">
                    <img src="logo.png" alt="Logo" class="site-logo" onerror="this.src='icon.png'">
                </a>
            </div>
            
            <div class="nav-actions">
                <button id="themeToggle" class="btn-circle" title="Theme Toggle">🌙</button>
            </div>
        </div>
    </header>

    <!-- Top Loading Bar -->
    <div id="loader" class="loader-bar"></div>

    <!-- Search Section -->
    <section class="search-section">
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Search any song, album, or artist...">
            <button id="searchBtn">Search</button>
        </div>
    </section>

    <!-- Main Dynamic Content Container -->
    <main class="main-container" id="mainContainer">
        <!-- Song list loaded dynamically -->
    </main>

    <!-- FULL SCREEN IMMERSIVE MUSIC PLAYER -->
    <div class="fullscreen-player" id="fullscreenPlayer">
        <!-- Top Navigation -->
        <div class="fs-top-bar">
            <span class="fs-tag">Now Playing</span>
            <button id="closePlayerBtn" class="fs-close-btn" title="Close & Stop">✕</button>
        </div>

        <!-- Center: Rotating Disc Artwork & Fixed Center Icon -->
        <div class="fs-visualizer-area">
            <div class="vinyl-record" id="vinylDisc">
                <img id="currentThumb" src="icon.png" alt="Cover Artwork" class="vinyl-thumb">
            </div>
            <div class="vinyl-center-pin" id="centerFixedPin">
                <img src="icon.png" alt="Logo" class="center-fixed-icon">
            </div>
        </div>

        <!-- Track Information -->
        <div class="fs-meta">
            <h2 id="currentTitle">No song selected</h2>
            <p id="currentArtist">Music Player</p>
        </div>

        <!-- Progress Bar -->
        <div class="fs-progress-wrapper">
            <input type="range" id="progressBar" value="0" min="0" max="100">
            <div class="fs-timestamps">
                <span id="currentTime">0:00</span>
                <span id="totalDuration">0:00</span>
            </div>
        </div>

        <!-- 5-Button Player Controls -->
        <div class="fs-controls">
            <button id="shuffleBtn" class="fs-ctrl-btn toggle-btn" title="Shuffle: Off">
                <img src="icon/suffel1.png" alt="Shuffle" id="shuffleIcon" class="ctrl-icon-img">
            </button>
            <button id="prevBtn" class="fs-ctrl-btn nav-btn" title="Previous">⏮</button>
            <button id="playPauseBtn" class="fs-main-play" title="Play/Pause">▶</button>
            <button id="nextBtn" class="fs-ctrl-btn nav-btn" title="Next">⏭</button>
            <button id="repeatBtn" class="fs-ctrl-btn toggle-btn" title="Repeat: Off">
                <img src="icon/repeat1.png" alt="Repeat" id="repeatIcon" class="ctrl-icon-img">
            </button>
        </div>

        <!-- Bottom Actions (Queue on Left, Download on Right) -->
        <div class="fs-bottom-bar">
            <button id="queueToggleBtn" class="fs-action-btn" title="View Queue">📑 Queue</button>
            <button id="downloadBtn" class="fs-action-btn" title="Download Song">⬇ Download</button>
        </div>

        <!-- Slide-up Queue Drawer -->
        <div class="queue-drawer" id="queueDrawer">
            <div class="queue-header">
                <h3>Current Queue</h3>
                <button id="closeQueueBtn" class="close-queue-btn">✕</button>
            </div>
            <div class="queue-list" id="queueList">
                <!-- Queue songs dynamically injected here -->
            </div>
        </div>
    </div>

    <!-- Hidden Audio Element -->
    <audio id="audioSource"></audio>

    <!-- Footer -->
    <footer class="footer">
        <p>&copy; 2026 <strong>music.bdey.online</strong> | Powered by JioSaavn Unofficial API</p>
    </footer>

    <!-- Browser ID3 Metadata Injector -->
    <script src="https://cdn.jsdelivr.net/npm/browser-id3-writer@4.4.0/dist/browser-id3-writer.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
