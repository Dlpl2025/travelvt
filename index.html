<html lang="en">
<head>
  <link rel="manifest" href="manifest.json">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Live VT Player</title>
  
  <!-- Browser Tab Favicon Logo -->
  <link rel="icon" type="image/png" href="logo.png" />
  
  <!-- Hls.js library to handle m3u8 playback -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    :root {
      --primary-red: #9e1026;
      --bg-color: #f8f9fa;
      --card-bg: #e6e6e6;
      --text-main: #222;
      --header-height: 56px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
      background-color: var(--bg-color);
      color: var(--text-main);
      overflow-x: hidden;
    }

    /* Blur & Lock App wrapper during login */
    .blurred-bg {
      filter: blur(10px);
      pointer-events: none;
      user-select: none;
      transition: filter 0.3s ease;
    }

    /* Fixed Red Header with Centered Logo & Logout on Right */
    header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: var(--header-height);
      background-color: var(--primary-red);
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 50;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
      padding: 0 16px;
    }

    .header-spacer {
      width: 70px;
    }

    .header-logo {
      height: 38px;
      width: auto;
      max-width: 160px;
      object-fit: contain;
      border-radius: 4px;
    }

    /* Logout Button Styling */
    .logout-btn {
      background: rgba(255, 255, 255, 0.18);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.4);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    .logout-btn:hover {
      background: rgba(255, 255, 255, 0.3);
    }

    .logout-btn:active {
      transform: scale(0.96);
    }

    /* Scrollable Main Content Area */
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: calc(var(--header-height) + 16px) 16px 32px 16px;
      min-height: 100vh;
      overflow-y: auto;
    }

    .section-title {
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 18px;
    }

    /* Responsive Grid for Mobile & Desktop */
    .channel-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
      gap: 16px;
      justify-items: center;
    }

    @media (min-width: 600px) {
      .channel-grid {
        grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
        gap: 24px;
      }
      .section-title {
        font-size: 1.5rem;
        margin-bottom: 24px;
      }
    }

    /* Channel Circular Cards */
    .channel-card {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background-color: var(--card-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 3px 6px rgba(0, 0, 0, 0.08);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      user-select: none;
      overflow: hidden;
      padding: 10px;
    }

    @media (min-width: 600px) {
      .channel-card {
        width: 120px;
        height: 120px;
        padding: 14px;
      }
    }

    .channel-card:active {
      transform: scale(0.95);
    }

    .channel-card:hover {
      transform: translateY(-3px) scale(1.04);
      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.16);
      background-color: #dedede;
    }

    .channel-logo {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 50%;
    }

    /* Video Popup / Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.88);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 12px;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-content {
      background: #111;
      color: #fff;
      width: 100%;
      max-width: 800px;
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.6);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 14px;
      background: #1a1a1a;
      min-height: 48px;
    }

    .modal-logo {
      height: 32px;
      width: 32px;
      object-fit: contain;
      border-radius: 50%;
      background-color: #fff;
      padding: 2px;
    }

    .close-btn {
      background: transparent;
      border: none;
      color: #fff;
      font-size: 1.6rem;
      cursor: pointer;
      padding: 2px 8px;
      line-height: 1;
      border-radius: 4px;
    }

    .close-btn:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    .video-container {
      position: relative;
      width: 100%;
      background: #000;
      aspect-ratio: 16 / 9;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* Player Controls Bar */
    .player-controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      background: #1a1a1a;
      gap: 8px;
      flex-wrap: wrap;
    }

    .nav-buttons, .right-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .ctrl-btn {
      background: #333;
      color: #fff;
      border: 1px solid #444;
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }

    .ctrl-btn:hover {
      background: #4f4f4f;
    }

    .volume-slider {
      cursor: pointer;
      accent-color: var(--primary-red);
      width: 60px;
    }

    @media (min-width: 480px) {
      .volume-slider {
        width: 80px;
      }
    }

    /* Login Popup Overlay */
    .login-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 200;
      padding: 20px;
    }

    .login-box {
      background: #ffffff;
      width: 100%;
      max-width: 360px;
      padding: 28px 24px;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      text-align: center;
    }

    .login-logo {
      height: 52px;
      width: auto;
      max-width: 180px;
      object-fit: contain;
      margin-bottom: 16px;
    }

    .login-title {
      font-size: 1.15rem;
      font-weight: 700;
      margin-bottom: 20px;
      color: #222;
    }

    .login-field {
      width: 100%;
      margin-bottom: 14px;
      text-align: left;
    }

    .login-field label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: #555;
      margin-bottom: 5px;
    }

    .login-field input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .login-field input:focus {
      border-color: var(--primary-red);
    }

    .login-btn {
      width: 100%;
      padding: 11px;
      background-color: var(--primary-red);
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
      transition: background-color 0.2s;
    }

    .login-btn:hover {
      background-color: #820d20;
    }

    .error-msg {
      color: #dc3545;
      font-size: 0.82rem;
      margin-top: 12px;
      display: none;
    }
  </style>
</head>
<body>

  <!-- Background Application Wrapper (Blurred until Login) -->
  <div id="appContainer" class="blurred-bg">
    <!-- Fixed Red Header -->
    <header>
      <div class="header-spacer"></div>
      <img class="header-logo" src="logo.png" alt="LIVE VT Logo" />
      <button class="logout-btn" id="logoutBtn" title="Sign Out">Log Out</button>
    </header>

    <!-- Scrollable Channel Grid Area -->
    <main class="container">
      <h2 class="section-title">All Channels</h2>
      <div class="channel-grid" id="channelGrid">
        <!-- Dynamic Channel Bubbles injected via JavaScript -->
      </div>
    </main>
  </div>

  <!-- Login Popup Modal -->
  <div class="login-overlay" id="loginModal">
    <div class="login-box">
      <img class="login-logo" src="logo.png" alt="App Logo" />
      <div class="login-title">Sign In to Continue</div>
      <form id="loginForm">
        <div class="login-field">
          <label for="username">User ID</label>
          <input type="text" id="username" autocomplete="off" required placeholder="Enter User ID" />
        </div>
        <div class="login-field">
          <label for="password">Password</label>
          <input type="password" id="password" required placeholder="Enter Password" />
        </div>
        <button type="submit" class="login-btn">Log In</button>
        <div class="error-msg" id="loginError">Invalid ID or Password. Please try again.</div>
      </form>
    </div>
  </div>

  <!-- Video Popup Modal -->
  <div class="modal-overlay" id="videoModal">
    <div class="modal-content">
      <div class="modal-header">
        <img class="modal-logo" id="currentChannelLogo" src="" alt="Channel Logo" />
        <button class="close-btn" id="closeModal" title="Close (X)">&times;</button>
      </div>

      <div class="video-container" id="videoContainer">
        <video id="videoPlayer" playsinline></video>
      </div>

      <div class="player-controls">
        <div class="nav-buttons">
          <button class="ctrl-btn" id="prevBtn" title="Previous Channel">&#10094; Prev</button>
          <button class="ctrl-btn" id="nextBtn" title="Next Channel">Next &#10095;</button>
        </div>

        <div class="right-controls">
          <button class="ctrl-btn" id="muteBtn" title="Mute/Unmute">🔊</button>
          <input type="range" id="volumeSlider" class="volume-slider" min="0" max="1" step="0.05" value="1" title="Volume Control" />
          <button class="ctrl-btn" id="fullscreenBtn" title="Fullscreen">⛶ Fullscreen</button>
        </div>
      </div>
    </div>
  </div>

      loginModal.style.display = "none";
      appContainer.classList.remove("blurred-bg");

    // DOM Elements
    const grid = document.getElementById("channelGrid");
    const modal = document.getElementById("videoModal");
    const video = document.getElementById("videoPlayer");
    const channelLogoEl = document.getElementById("currentChannelLogo");
    const closeModalBtn = document.getElementById("closeModal");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");
    const muteBtn = document.getElementById("muteBtn");
    const volumeSlider = document.getElementById("volumeSlider");
    const fullscreenBtn = document.getElementById("fullscreenBtn");

    let currentIndex = 0;
    let hls = null;

    // Render Channel Cards
    channels.forEach((channel, index) => {
      const card = document.createElement("div");
      card.className = "channel-card";
      card.title = channel.name;
      card.innerHTML = `<img class="channel-logo" src="${channel.logo}" alt="${channel.name}" loading="lazy" />`;
      card.addEventListener("click", () => openPlayer(index));
      grid.appendChild(card);
    });

    // Play Stream via HLS.js or Native
    function playChannel(index) {
      currentIndex = index;
      const channel = channels[currentIndex];
      
      channelLogoEl.src = channel.logo;
      channelLogoEl.alt = channel.name;

      if (hls) {
        hls.destroy();
      }

      if (Hls.isSupported()) {
        hls = new Hls();
        hls.loadSource(channel.url);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, () => {
          video.play().catch(() => {});
        });
      } else if (video.canPlayType("application/vnd.apple.mpegurl")) {
        video.src = channel.url;
        video.addEventListener("loadedmetadata", () => {
          video.play().catch(() => {});
        });
      }
    }

    // Open Modal
    function openPlayer(index) {
      modal.classList.add("active");
      playChannel(index);
    }

    // Close Modal & Reset Video
    function closePlayer() {
      if (document.fullscreenElement) {
        document.exitFullscreen().catch(() => {});
      }
      modal.classList.remove("active");
      if (hls) {
        hls.destroy();
        hls = null;
      }
      video.pause();
      video.src = "";
    }

    // Navigation Events
    prevBtn.addEventListener("click", () => {
      let prevIndex = currentIndex - 1;
      if (prevIndex < 0) prevIndex = channels.length - 1;
      playChannel(prevIndex);
    });

    nextBtn.addEventListener("click", () => {
      let nextIndex = (currentIndex + 1) % channels.length;
      playChannel(nextIndex);
    });

    // Volume & Mute Controls
    volumeSlider.addEventListener("input", (e) => {
      video.volume = parseFloat(e.target.value);
      video.muted = video.volume === 0;
      muteBtn.textContent = video.muted ? "🔇" : "🔊";
    });

    muteBtn.addEventListener("click", () => {
      video.muted = !video.muted;
      muteBtn.textContent = video.muted ? "🔇" : "🔊";
      volumeSlider.value = video.muted ? 0 : video.volume;
    });

    // Fullscreen Trigger
    fullscreenBtn.addEventListener("click", () => {
      if (!document.fullscreenElement) {
        if (video.requestFullscreen) {
          video.requestFullscreen();
        } else if (video.webkitRequestFullscreen) {
          video.webkitRequestFullscreen();
        } else if (video.webkitEnterFullscreen) {
          video.webkitEnterFullscreen();
        } else if (video.msRequestFullscreen) {
          video.msRequestFullscreen();
        }
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        } else if (document.webkitExitFullscreen) {
          document.webkitExitFullscreen();
        }
      }
    });

    // Modal Close Triggers
    closeModalBtn.addEventListener("click", closePlayer);

    modal.addEventListener("click", (e) => {
      if (e.target === modal) {
        closePlayer();
      }
    });

    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && modal.classList.contains("active")) {
        closePlayer();
      }
    });
